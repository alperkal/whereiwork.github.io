name: Jekyll Build for new post
on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Image Name'
        default: 'assets/img/name.jpg'
        required: true
      title:
        description: 'Post Title'
        default: 'Random - Vienna'
        required: true

permissions:
  contents: write

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image-processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl \
            imagemagick \
            jpegoptim \
            optipng

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: gitcheck.sh
        run: ./gitcheck.sh ${{ github.event.inputs.filename }} "${{ github.event.inputs.title }}"

      - uses: helaili/jekyll-action@2.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: 'master'

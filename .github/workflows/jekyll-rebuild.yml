name: Jekyll rebuild
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - uses: helaili/jekyll-action@2.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: 'master'

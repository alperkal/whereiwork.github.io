<head>
  {% if page.amp %}
  <link rel="amphtml" href="{{site.url}}{{site.baseurl}}/amp{{ page.url }}">
  {% endif %}
  {% include meta.html %}
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/syntax.css">
  <!-- Use Atom -->
  {% feed_meta %}
  <!-- RSS-v2.0
  <link href="{{ site.github.url }}/rss-feed.xml" type="application/rss+xml" rel="alternate" title="{{ site.title }} | {{ site.description }}"/>
  //-->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Source+Code+Pro">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">
  <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML">
  </script>
  <!-- Google Analytics -->
  {% include google-analytics.html %}
  <!-- Posthog -->
  {% include posthog.html %}
  <!-- Use Jekyll SEO plugin -->
  {% seo %}
  {% if page.layout == 'post' and page.image and page.location.latitude and page.location.longitude %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "contentUrl": {{ page.image | absolute_url | jsonify }},
    "name": {{ page.title | jsonify }},
    "creator": { "@type": "Person", "name": {{ site.author | jsonify }} },
    "datePublished": {{ page.date | date: '%Y-%m-%d' | jsonify }},
    "contentLocation": {
      "@type": "Place",
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": {{ page.location.latitude | jsonify }},
        "longitude": {{ page.location.longitude | jsonify }}
      }
    }
  }
  </script>
  {% endif %}
  {% if page.location.latitude %}
  <meta property="twitter:label1" content="Visit on Google Maps"/>
  <meta property="twitter:data1" content="http://maps.google.com/maps?q={{ page.location.latitude }},{{ page.location.longitude }}&ll={{ page.location.latitude }},{{ page.location.longitude }}&z=17"/>
  {% endif %}
</head>
